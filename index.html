<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pengenalan Objek - Database</title>
    <!-- Memuat Dexie.js dari CDN untuk IndexedDB yang mudah -->
    <script src="https://unpkg.com/dexie@3/dist/dexie.js"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            background: #f4f4f9;
        }
        video, img#preview {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            background: #000;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        input, textarea, button {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #218838;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Kamera Pengenalan Objek</h2>
        
        <!-- Live Preview Kamera -->
        <video id="cameraStream" autoplay playsinline></video>
        <div>
            <button id="captureBtn" style="background: #007bff;">Ambil Foto untuk Disimpan</button>
        </div>

        <!-- Form Tambah Objek (Muncul setelah foto diambil) -->
        <div id="formContainer" class="hidden">
            <h3>Daftarkan Objek Baru</h3>
            <img id="snapshotPreview" alt="Preview Foto">
            <input type="text" id="objName" placeholder="Nama Objek (Contoh: Botol Minum)">
            <textarea id="objDesc" placeholder="Deskripsi Objek (Contoh: Botol plastik 500ml warna biru)"></textarea>
            <button id="saveBtn">Simpan ke Database</button>
            <button id="cancelBtn" style="background: #6c757d; margin-top: 5px;">Batal</button>
        </div>

        <!-- Daftar Objek Tersimpan -->
        <div style="margin-top: 30px; text-align: left;">
            <h3>Database Lokal:</h3>
            <ul id="objectList"></ul>
        </div>
    </div>

    <canvas id="snapshotCanvas" style="display:none;"></canvas>

    <script>
        // 1. Inisialisasi Database IndexedDB menggunakan Dexie
        const db = new Dexie('ObjekDatabase');
        db.version(1).stores({
            items: '++id, name, description, image'
        });

        const video = document.getElementById('cameraStream');
        const captureBtn = document.getElementById('captureBtn');
        const canvas = document.getElementById('snapshotCanvas');
        const formContainer = document.getElementById('formContainer');
        const snapshotPreview = document.getElementById('snapshotPreview');
        const objNameInput = document.getElementById('objName');
        const objDescInput = document.getElementById('objDesc');
        const saveBtn = document.getElementById('saveBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const objectList = document.getElementById('objectList');

        let capturedBlob = null; // Menyimpan data gambar sementara

        // Aktifkan Kamera
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                video.srcObject = stream;
            } catch (error) {
                console.error("Gagal akses kamera:", error);
                alert("Izin kamera ditolak atau tidak didukung.");
            }
        }
        window.addEventListener('load', () => {
            startCamera();
            loadObjectList(); // Tampilkan data yang sudah ada saat halaman dimuat
        });

        // Ambil Foto dan Tampilkan Form Input
        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
                capturedBlob = blob;
                const imageUrl = URL.createObjectURL(blob);
                snapshotPreview.src = imageUrl;

                // Sembunyikan video, tampilkan form
                video.style.display = 'none';
                captureBtn.style.display = 'none';
                formContainer.classList.remove('hidden');
            }, 'image/jpeg');
        });

        // Tombol Batal
        cancelBtn.addEventListener('click', () => {
            formContainer.classList.add('hidden');
            video.style.display = 'block';
            captureBtn.style.display = 'block';
            objNameInput.value = '';
            objDescInput.value = '';
        });

        // Simpan Data ke IndexedDB
        saveBtn.addEventListener('click', async () => {
            const name = objNameInput.value.trim();
            const description = objDescInput.value.trim();

            if (!name || !capturedBlob) {
                alert("Nama objek dan foto wajib diisi!");
                return;
            }

            try {
                // Simpan ke database
                await db.items.add({
                    name: name,
                    description: description,
                    image: capturedBlob
                });

                alert("Objek berhasil disimpan ke database!");
                
                // Reset form & kembali ke kamera
                cancelBtn.click();
                loadObjectList();
            } catch (error) {
                console.error("Gagal menyimpan:", error);
                alert("Terjadi kesalahan saat menyimpan data.");
            }
        });

        // Fungsi untuk menampilkan daftar objek yang tersimpan
        async function loadObjectList() {
            objectList.innerHTML = '';
            const allItems = await db.items.toArray();
            if (allItems.length === 0) {
                objectList.innerHTML = '<li>Belum ada objek tersimpan.</li>';
                return;
            }
            allItems.forEach(item => {
                const li = document.createElement('li');
                li.textContent = `${item.name} - ${item.description}`;
                objectList.appendChild(li);
            });
        }
    </script>

</body>
</html>
