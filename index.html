<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pengenalan Objek - Full Features</title>
    <!-- Memuat Dexie.js dari CDN -->
    <script src="https://unpkg.com/dexie@3/dist/dexie.js"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            background: #f4f4f9;
        }
        video, img#preview, img#resultImage {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            background: #000;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        input, textarea, button {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            opacity: 0.9;
        }
        .hidden { display: none; }
        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-top: 15px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Aplikasi Pengenalan Objek</h2>
        
        <!-- Tampilan Utama Kamera -->
        <div id="cameraContainer">
            <video id="cameraStream" autoplay playsinline></video>
            <div>
                <button id="recognizeBtn" style="background: #28a745;">Kenali Objek</button>
            </div>
        </div>

        <!-- Hasil Pengenalan (Jika Dikenal / Tidak Dikenal) -->
        <div id="resultContainer" class="hidden">
            <div id="recognizedResult" class="hidden card">
                <h3>Objek Dikenali!</h3>
                <img id="resultImage" alt="Foto Referensi">
                <p><strong>Nama:</strong> <span id="resName"></span></p>
                <p><strong>Deskripsi:</strong> <span id="resDesc"></span></p>
            </div>

            <div id="unrecognizedResult" class="hidden card" style="background: #fff3cd; border: 1px solid #ffeeba;">
                <h3>Objek Tidak Dikenal</h3>
                <p>Objek ini belum ada di dalam database Anda.</p>
                <button id="goToRegisterBtn" style="background: #ffc107; color: #000;">Tambah ke Database</button>
            </div>

            <button id="backToCameraBtn" style="background: #6c757d; margin-top: 15px;">Kembali ke Kamera</button>
        </div>

        <!-- Form Tambah Objek Baru (Fitur 1) -->
        <div id="formContainer" class="hidden">
            <h3>Daftarkan Objek Baru</h3>
            <img id="snapshotPreview" alt="Preview Foto">
            <input type="text" id="objName" placeholder="Nama Objek (Contoh: Botol Minum)">
            <textarea id="objDesc" placeholder="Deskripsi Objek"></textarea>
            <button id="saveBtn" style="background: #28a745;">Simpan ke Database</button>
            <button id="cancelFormBtn" style="background: #6c757d;">Batal</button>
        </div>

        <!-- Daftar Objek Tersimpan -->
        <div style="margin-top: 30px; text-align: left;">
            <h3>Database Lokal (<span id="countItems">0</span>):</h3>
            <ul id="objectList" style="padding-left: 20px;"></ul>
        </div>
    </div>

    <canvas id="snapshotCanvas" style="display:none;"></canvas>

    <script>
        // Inisialisasi Database
        const db = new Dexie('ObjekDatabase');
        db.version(1).stores({
            items: '++id, name, description, image'
        });

        const video = document.getElementById('cameraStream');
        const recognizeBtn = document.getElementById('recognizeBtn');
        const canvas = document.getElementById('snapshotCanvas');
        
        const cameraContainer = document.getElementById('cameraContainer');
        const resultContainer = document.getElementById('resultContainer');
        const recognizedResult = document.getElementById('recognizedResult');
        const unrecognizedResult = document.getElementById('unrecognizedResult');
        const formContainer = document.getElementById('formContainer');
        
        const resName = document.getElementById('resName');
        const resDesc = document.getElementById('resDesc');
        const resImage = document.getElementById('resultImage');
        
        const goToRegisterBtn = document.getElementById('goToRegisterBtn');
        const backToCameraBtn = document.getElementById('backToCameraBtn');
        
        const snapshotPreview = document.getElementById('snapshotPreview');
        const objNameInput = document.getElementById('objName');
        const objDescInput = document.getElementById('objDesc');
        const saveBtn = document.getElementById('saveBtn');
        const cancelFormBtn = document.getElementById('cancelFormBtn');
        const objectList = document.getElementById('objectList');
        const countItems = document.getElementById('countItems');

        let currentBlob = null; // Menyimpan blob foto saat tombol "Kenali" ditekan

        // Aktifkan Kamera
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                video.srcObject = stream;
            } catch (error) {
                console.error("Gagal akses kamera:", error);
                alert("Izin kamera ditolak.");
            }
        }

        window.addEventListener('load', () => {
            startCamera();
            updateDatabaseUI();
        });

        // Ambil Snapshot dari Video
        function captureSnapshot() {
            canvas.width = 200; // Perkecil ukuran untuk komparasi cepat
            canvas.height = 200;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            return new Promise(resolve => {
                canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.8);
            });
        }

        // Algoritma Sederhana Pencocokan Warna/Gambar (Berdasarkan selisih ukuran/data byte blob atau hash warna)
        async function matchObject(newBlob) {
            const allItems = await db.items.toArray();
            if (allItems.length === 0) return null;

            // Logika pencocokan sederhana: Membandingkan ukuran file blob atau kita cari kecocokan persentase warna
            // Untuk demo web sederhana, kita bandingkan ukuran byte dan ambil yang paling mendekati, 
            // atau simulasi pencocokan dengan item pertama/skor kemiripan ukuran.
            let bestMatch = null;
            let minDiff = Infinity;

            for (let item of allItems) {
                const diff = Math.abs(item.image.size - newBlob.size);
                // Batas toleransi perbedaan ukuran bytes untuk dianggap objek yang mirip
                if (diff < minDiff && diff < 15000) { 
                    minDiff = diff;
                    bestMatch = item;
                }
            }

            // Jika selisih terlalu jauh, anggap tidak dikenal
            return minDiff < 15000 ? bestMatch : null;
        }

        // Tombol "Kenali Objek" Ditekan
        recognizeBtn.addEventListener('click', async () => {
            currentBlob = await captureSnapshot();
            const matchedItem = await matchObject(currentBlob);

            cameraContainer.classList.add('hidden');
            resultContainer.classList.remove('hidden');

            if (matchedItem) {
                // Objek Dikenal (Fitur 4)
                recognizedResult.classList.remove('hidden');
                unrecognizedResult.classList.add('hidden');
                
                resName.textContent = matchedItem.name;
                resDesc.textContent = matchedItem.description;
                resImage.src = URL.createObjectURL(matchedItem.image);
            } else {
                // Objek Tidak Dikenal (Fitur 3)
                recognizedResult.classList.add('hidden');
                unrecognizedResult.classList.remove('hidden');
            }
        });

        // Tombol "Tambah ke Database" dari menu Tidak Dikenal
        goToRegisterBtn.addEventListener('click', () => {
            resultContainer.classList.add('hidden');
            formContainer.classList.remove('hidden');
            snapshotPreview.src = URL.createObjectURL(currentBlob);
        });

        // Tombol Kembali ke Kamera
        backToCameraBtn.addEventListener('click', () => {
            resultContainer.classList.add('hidden');
            cameraContainer.classList.remove('hidden');
        });

        // Tombol Batal Form Pendaftaran
        cancelFormBtn.addEventListener('click', () => {
            formContainer.classList.add('hidden');
            cameraContainer.classList.remove('hidden');
            objNameInput.value = '';
            objDescInput.value = '';
        });

        // Simpan ke Database (Fitur 1)
        saveBtn.addEventListener('click', async () => {
            const name = objNameInput.value.trim();
            const description = objDescInput.value.trim();

            if (!name || !currentBlob) {
                alert("Nama objek wajib diisi!");
                return;
            }

            await db.items.add({
                name: name,
                description: description,
                image: currentBlob
            });

            alert("Objek berhasil disimpan!");
            cancelFormBtn.click();
            updateDatabaseUI();
        });

        // Perbarui Daftar Tampilan Database
        async function updateDatabaseUI() {
            const allItems = await db.items.toArray();
            countItems.textContent = allItems.length;
            objectList.innerHTML = '';
            
            if (allItems.length === 0) {
                objectList.innerHTML = '<li>Belum ada data.</li>';
                return;
            }

            allItems.forEach(item => {
                const li = document.createElement('li');
                li.textContent = `${item.name}`;
                objectList.appendChild(li);
            });
        }
    </script>

</body>
</html>
